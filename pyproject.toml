[project]
name = "doomtp-bot"
version = "0.1.0"
description = "Multi-channel Twitch chat bot with a composable command language"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "twitchio>=3,<4",
    "aiohttp>=3.9",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    # Moderators write regexes that run on every chat line; `re` can't be stopped once it backtracks.
    "regex>=2024.11.6",
    # Windows has no system timezone database, and cron schedules run in the channel's own timezone.
    "tzdata>=2024.1 ; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pyyaml>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-regex",
    "railroad-diagrams>=3",
]

[project.scripts]
doomtp-bot = "doomtp_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomtp_bot"]

[tool.hatch.build.targets.wheel.force-include]
# The language page shows the grammar (ADR-0011), and `docs/` is not installed: ship a copy with it.
"docs/grammar/railroad.ebnf" = "doomtp_bot/webui/static/railroad.ebnf"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
xfail_strict = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["E501"]  # line length is enforced by `ruff format`; long docstrings/comments are allowed

[tool.ruff.format]
# ruff formats fenced Python in Markdown; docs/ shows illustrative, hand-aligned code that isn't ours to
# reflow (and doesn't have to compile), so the formatter stays out of it.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
packages = ["doomtp_bot"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["doomtp_bot.lang.*", "doomtp_bot.runtime.*", "doomtp_bot.core.*"]
strict = true
