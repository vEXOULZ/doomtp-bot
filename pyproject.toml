[project]
name = "doomtp-bot"
version = "0.1.0"
description = "Multi-channel Twitch chat bot with a composable command language"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "twitchio>=3,<4",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pyyaml>=6",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
doomtp-bot = "doomtp_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomtp_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
xfail_strict = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["E501"]  # line length is enforced by `ruff format`; long docstrings/comments are allowed

[tool.mypy]
python_version = "3.11"
packages = ["doomtp_bot"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["doomtp_bot.lang.*", "doomtp_bot.runtime.*", "doomtp_bot.core.*"]
strict = true
