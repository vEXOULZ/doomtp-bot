[project]
name = "doomtp-bot"
version = "0.10.0"
description = "Multi-channel Twitch chat bot with a composable command language"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "twitchio>=3,<4",
    "aiohttp>=3.14.4",
    "psycopg[binary]>=3.2",
    # Schema migrations with a downgrade for every upgrade, so an image rollback can undo them (ADR-0022).
    "alembic>=1.14",
    "sqlalchemy>=2.0.36",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    # Shared job runtime, /api/v2 conventions and audit log with twitch-archive (ADR-0027). A tarball, since
    # the image has no git.
    "vex-platform @ https://github.com/vEXOULZ/vex-platform/archive/refs/tags/v0.6.0.tar.gz",
    # Moderators write regexes that run on every chat line; `re` can't be stopped once it backtracks.
    "regex>=2024.11.6",
    # Windows has no system timezone database, and cron schedules run in the channel's own timezone.
    "tzdata>=2024.1 ; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pyyaml>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-regex",
    "railroad-diagrams>=3",
]

[project.scripts]
doomtp-bot = "doomtp_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# vex-platform is a tarball URL, not a PyPI release (ADR-0027).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/doomtp_bot"]

[tool.hatch.build.targets.wheel.force-include]
# The language page shows the grammar (ADR-0011), and `docs/` is not installed: ship a copy with it.
"docs/grammar/railroad.ebnf" = "doomtp_bot/api/static/railroad.ebnf"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
xfail_strict = true

[tool.ruff]
extend = ".conventions/ruff.toml"

[tool.ruff.lint]
extend-select = ["W", "ASYNC", "SIM"]
# Long SQL literals and docstrings read better unwrapped; the formatter still wraps code at 120.
ignore = ["E501"]

[tool.ruff.format]
# ruff formats fenced Python in Markdown; docs/ shows illustrative, hand-aligned code that isn't ours to
# reflow (and doesn't have to compile), so the formatter stays out of it.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["doomtp_bot"]
mypy_path = "src"

[tool.uv]
required-version = ">=0.5"

[[tool.mypy.overrides]]
# No type information: vex-platform v0.6.0 ships no py.typed.
module = ["vex_platform.*"]
ignore_missing_imports = true
