# Parser conformance corpus — command-language-spec Appendix A.1 (+ cases added with Appendix C),
# syntax 2.0 (ADR-0018).
# Shared by pytest (parser: ast / error / column) and vitest in web-editor/ (token classes only).
#
# Fields:
#   input               text as received (Line context: before pre-processing)
#   context             line | body | trigger | listener | callback      (default: line)
#   prefix              channel prefix                                     (default: "!")
#   reply_parent_login  simulate a reply (spec §2.1 step 2)
#   raw_tail            map of command -> {lead-args-joined-by-space: N}; "" key = no lead args
# Expectations (exactly one):
#   ast                 canonical form, see doomtp_bot.lang.ast.to_canonical
#   error               parse error code (optionally `column`, 1-based)
#   not_command: true   Line context only

defaults:
  raw_tail:
    explain: {"": 1}
    cc: {"add": 3, "edit": 3}

cases:
  - id: A1.01-pipe-placeholder
    input: '!random 1-100 | echo dice rolled a {_1}!'
    ast: 'Pipe(random["1-100"], echo["dice","rolled","a","{_1}!"])'

  - id: A1.02-operators-only-when-standalone
    input: '!echo a|b ;) a->b > >> >:( (lol)'
    ast: 'echo["a|b",";)","a->b",">",">>",">:(","(lol)"]'

  - id: A1.03-apostrophe-and-double-quotes
    input: "!echo it's \"a | b\" fine"
    ast: 'echo["it''s","a | b","fine"]'

  - id: A1.04-quote-concatenation
    input: '!echo ab"c d"e'
    ast: 'echo["abc de"]'

  - id: A1.05-standalone-pipe
    input: '!echo | literal'
    ast: 'Pipe(echo[], literal[])'

  - id: A1.06-escaped-pipe
    input: '!echo \| literal'
    ast: 'echo["|","literal"]'

  - id: A1.07-reserved-semicolon
    input: '!echo a ; b'
    error: E_RESERVED_OPERATOR
    column: 9

  - id: A1.08-unterminated-quote
    input: '!echo "unterminated'
    error: E_UNTERMINATED_QUOTE

  - id: A1.09-unknown-placeholder-root
    input: '!echo {friend}'
    error: E_BAD_PLACEHOLDER

  - id: A1.10-escaped-brace
    input: '!echo \{friend}'
    ast: 'echo["\\{friend\\}"]'

  - id: A1.11-group-or-and
    input: '( !a || true ) && !b'
    ast: 'And(Group(Or(a[], true[])), b[])'

  - id: A1.12-precedence
    input: '!a && !b | !c -> channel.x || !d'
    ast: 'Or(And(a[], Pipe(b[], Store(c[], channel.x))), d[])'

  - id: A1.13-unexpected-operator
    input: '!a | && !b'
    error: E_UNEXPECTED_OPERATOR

  - id: A1.14-dynamic-varref
    input: '!a -> {chatter.name}'
    error: E_DYNAMIC_VARREF

  - id: A1.15-explain-raw-tail
    input: '!explain !random 1-6 | echo {_1}'
    ast: 'explain[]~"!random 1-6 | echo {_1}"'

  - id: A1.16-cc-add-raw-tail-quoted
    input: '!cc add roll "!random 1-6 | echo {_1}"'
    ast: 'cc["add","roll"]~"!random 1-6 | echo {_1}"'

  - id: A1.17-not-a-command
    input: '! random'
    not_command: true

  - id: A1.18-reply-mention-stripped
    input: '@alice !random 1-6'
    reply_parent_login: alice
    ast: 'random["1-6"]'

  - id: A1.19-nested-fallback
    input: '!echo {chatter.location ?? {channel.location ?? Lisbon}}'
    ast: 'echo["{chatter.location ?? {channel.location ?? Lisbon}}"]'

  - id: A1.20-typed-choice-placeholder
    context: body
    input: 'echo {arg.1:choice(a,b) ?? a}'
    ast: 'echo["{arg.1:choice(a,b) ?? a}"]'

  # ── Added with Appendix C ──────────────────────────────────────────────────
  - id: C.01-empty-group
    input: '( ) !a'
    not_command: true            # LineStart needs `( ` followed by prefix+name

  - id: C.02-empty-group-in-body
    context: body
    input: '( )'
    error: E_UNEXPECTED_OPERATOR

  - id: C.03-bad-name-boundary
    input: '!echo"x"'
    error: E_BAD_NAME

  - id: C.04-raw-tail-inside-expression
    input: '!a && !cc add x y'
    error: E_RAW_TAIL_POSITION

  - id: C.05-cc-info-is-not-raw
    input: '!cc info x | echo {_1}'
    ast: 'Pipe(cc["info","x"], echo["{_1}"])'

  - id: C.06-missing-operand
    input: '!a |'
    error: E_MISSING_OPERAND

  - id: C.07-inches-quote
    input: "!echo 6'2\""
    error: E_UNTERMINATED_QUOTE

  - id: C.08-append-store
    input: '!roll --> chatter.rolls'
    ast: 'Append(roll[], chatter.rolls)'

  - id: C.09-publisher-channel-chatter
    context: body
    input: 'incr -> publisher.channel.chatter.wins'
    ast: 'Store(incr[], publisher.channel.chatter.wins)'

  - id: C.10-reserved-var-name
    input: '!a -> channel.chatter'
    error: E_BAD_VARREF

  - id: C.11-personal-alias
    input: '!@roll 20'
    ast: '@roll["20"]'

  - id: C.12-unbalanced-group
    input: '( !a || !b'
    error: E_UNBALANCED_GROUP

  # ── emoji prefix (spec §2.1: the shipped default, with an optional gap) ──
  - id: C.13-emoji-prefix
    prefix: '🏜'
    input: '🏜ping'
    ast: 'ping[]'

  - id: C.14-emoji-prefix-gap
    prefix: '🏜'
    input: '🏜 random 1-100 | echo {_1}'
    ast: 'Pipe(random["1-100"], echo["{_1}"])'

  - id: C.15-emoji-prefix-variation-selector
    prefix: '🏜'
    input: "🏜️ echo hi"
    ast: 'echo["hi"]'

  - id: C.16-ascii-prefix-has-no-gap
    input: '! random'
    not_command: true


  # ── syntax 2.0 (ADR-0018) ──────────────────────────────────────────────────
  - id: V2.01-bot-fields-have-a-sigil
    input: '!echo {$chatter.display} {chatter.display_name}'
    ast: 'echo["{$chatter.display}","{chatter.display_name}"]'

  - id: V2.02-a-number-is-a-number-in-bodies
    context: body
    input: 'echo {1} {1 + 1}'
    ast: 'echo["{1}","{1 + 1}"]'

  - id: V2.03-v1-result-ref-in-a-line
    input: '!echo {1}'
    error: E_BAD_PLACEHOLDER
    column: 7

  - id: V2.04-v1-bot-field-in-a-line
    input: '!echo {chatter.display}'
    error: E_BAD_PLACEHOLDER

  - id: V2.05-v1-store-in-a-line
    input: '!echo hi > channel.x'
    error: E_UNEXPECTED_OPERATOR
    column: 10

  - id: V2.06-v1-dot-into-a-result
    input: '!echo {_.x}'
    error: E_BAD_PLACEHOLDER

  - id: V2.07-arithmetic-precedence
    input: '!echo {-_1 * (2 + 3) // 4 % 5 - 1}'
    ast: 'echo["{((((-_1) * (2 + 3)) // 4) % 5) - 1}"]'

  - id: V2.08-chained-comparison-and-logic
    input: '!echo {1 < channel.x <= 3 and not $channel.live or false}'
    ast: 'echo["{((1 < channel.x <= 3) and (not $channel.live)) or false}"]'

  - id: V2.09-membership
    input: '!echo {arg.1 in channel.list} {2 not in _1}'
    ast: 'echo["{arg.1 in channel.list}","{2 not in _1}"]'

  - id: V2.10-brackets
    input: '!echo {channel.stats["best run"][-1]} {channel.q[arg.1]} {channel.log[_1]}'
    ast: 'echo["{channel.stats[\"best run\"][-1]}","{channel.q[arg.1]}","{channel.log[_1]}"]'

  - id: V2.11-accessors
    input: '!echo {channel.x:keys:len} {channel.x:len ?? 0}'
    ast: 'echo["{channel.x:keys:len}","{channel.x:len ?? 0}"]'

  - id: V2.12-command-substitution
    input: '!echo {!random 1-6} and {!echo {arg.1 ?? x}}'
    ast: 'echo["{!random[\"1-6\"]}","and","{!echo[\"{arg.1 ?? x}\"]}"]'

  - id: V2.13-check
    input: '!check {channel.x} > 3 && echo big'
    ast: 'And(check{{channel.x} > 3}, echo["big"])'

  - id: V2.14-bare-expression-line
    input: '!1 + 2 * 3'
    ast: 'calc{1 + (2 * 3)}'

  - id: V2.15-bare-expression-line-group
    prefix: '🏜'
    input: '🏜 (1 + 2) * 3'
    ast: 'calc{(1 + 2) * 3}'

  - id: V2.16-bare-expression-line-placeholder
    input: '!{channel.deaths} * 2'
    ast: 'calc{{channel.deaths} * 2}'

  - id: V2.17-a-lone-number-is-not-a-command
    input: '!100'
    not_command: true

  - id: V2.18-a-lone-negative-is-not-a-command
    input: '!-1'
    not_command: true

  - id: V2.19-ifelse
    input: '!ifelse {channel.deaths > 10} ( echo rough day ) ( echo going well )'
    ast: 'IfElse("{channel.deaths > 10}", Group(echo["rough","day"]), Group(echo["going","well"]))'

  - id: V2.20-ifelse-without-else
    input: '!ifelse {_.code == 224} ( echo empty )'
    ast: 'IfElse("{_.code == 224}", Group(echo["empty"]))'

  - id: V2.21-store-into-a-path
    input: '!echo a -> channel.log[arg.1][0]'
    ast: 'Store(echo["a"], channel.log[arg.1][0])'

  - id: V2.22-store-key-that-is-a-segment-name
    input: '!a -> channel.x[chatter]'
    ast: 'Store(a[], channel.x[chatter])'

  - id: V2.23-expression-syntax
    input: '!echo {1 +}'
    error: E_EXPR_SYNTAX

  - id: V2.24-unknown-operator
    input: '!echo {1 ** 2}'
    error: E_UNKNOWN_OP

  - id: V2.25-unknown-accessor
    input: '!echo {arg.1:integer}'
    error: E_UNKNOWN_OP

  - id: V2.26-expression-too-deep
    input: '!echo {((((((((((((((((((((((((((((((((((((((((1))))))))))))))))))))))))))))))))))))))))}'
    error: E_EXPR_TOO_DEEP

  - id: V2.27-ifelse-third-branch
    context: body
    input: 'ifelse {true} ( echo a ) ( echo b ) ( echo c )'
    error: E_UNEXPECTED_OPERATOR

  - id: V2.28-ifelse-needs-a-group
    context: body
    input: 'ifelse {true} echo a'
    error: E_EXPR_SYNTAX
