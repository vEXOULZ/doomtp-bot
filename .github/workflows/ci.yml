name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conventional Branch
        # Through the environment, never interpolated into the script: a branch name is user input.
        env:
          BRANCH: ${{ github.head_ref }}
        run: .githooks/check-branch-name.sh "$BRANCH"

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # --locked fails if uv.lock is missing or stale for pyproject.toml.
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check src tests scripts && uv run ruff format --check src tests scripts
      - name: Type check
        run: uv run mypy
      - name: Twitch CLI
        # Twitch's event simulator. Without it the EventSub handshake and fixture tests skip themselves
        # (ADR-0001 item 5, ADR-0002 item 4); bumping the version re-checks us against a newer simulator.
        run: |
          version=1.1.24
          url=https://github.com/twitchdev/twitch-cli/releases/download/v$version/twitch-cli_${version}_Linux_x86_64.tar.gz
          curl -fsSL "$url" | tar -xz
          sudo install "twitch-cli_${version}_Linux_x86_64/twitch" /usr/local/bin/twitch
          twitch version || true  # the CLI's own update check can crash it after it has done the job
      - name: Test
        run: uv run pytest -q
      - name: Grammar copy in sync with spec
        run: uv run python scripts/check_railroad.py
      - name: Railroad diagrams in sync with the grammar
        run: uv run python scripts/render_railroad.py --check

  web-editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-editor/package-lock.json
      - run: npm ci
      - run: npm test
      # The bundle is committed and served as it stands, so a source change without a rebuild is a bug.
      - name: Committed bundle matches the sources
        run: npm run build && git diff --exit-code ../src/doomtp_bot/webui/static/editor

  docker:
    runs-on: ubuntu-latest
    needs: python
    permissions:
      contents: read
      packages: write
    env:
      # A pull request builds the image and stops there; only main publishes one (ADR-0013).
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        # GHCR rejects an uppercase path, and an owner's login may well have one.
        id: image
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Server compose files are valid
        # Nothing else parses the production override, and it is only ever run on the box it matters on.
        env:
          BOT_IMAGE: ${{ steps.image.outputs.repo }}:main
        run: docker compose -f compose.yaml -f compose.prod.yaml --profile tools config --quiet
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          platforms: linux/amd64
          # :main is what a server follows; the sha tag is what it rolls back to.
          tags: |
            ${{ steps.image.outputs.repo }}:main
            ${{ steps.image.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
