name: ci

on:
  push:
    # dev is where work integrates, main is what production runs, and a v* tag is a release (ADR-0021).
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

jobs:
  conventions:
    uses: vEXOULZ/conventions/.github/workflows/conventions-check.yml@v2.0.0
    secrets: inherit

  ci:
    # The suite runs against a real Postgres, not a stand-in (ADR-0014). Same major as compose runs.
    uses: vEXOULZ/conventions/.github/workflows/python-ci.yml@v2.0.0
    with:
      postgres: true
      # The Twitch CLI is Twitch's event simulator, for the EventSub handshake tests (ADR-0001 item 5).
      # pg_dump is for the backup script's tests: it must be at least the server's version or it refuses
      # to dump, and the runner ships 16 against a 17 service, so take it from PostgreSQL's own apt repo.
      # The runner's 16 is ahead of the wrapper in /usr/bin, so name 17's bin directory explicitly.
      setup: |
        version=1.1.24
        url=https://github.com/twitchdev/twitch-cli/releases/download/v$version/twitch-cli_${version}_Linux_x86_64.tar.gz
        curl -fsSL "$url" | tar -xz
        sudo install "twitch-cli_${version}_Linux_x86_64/twitch" /usr/local/bin/twitch
        twitch version || true  # the CLI's own update check can crash it after it has done the job
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
        sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client-17
        echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      # --require-tools: a test whose tool (pg_dump, the Twitch CLI) is missing fails instead of skipping,
      # so a broken setup can't leave the run green with those tests unrun. Then the grammar copy and the
      # railroad diagrams must match the spec.
      test-command: |
        pg_dump --version && pg_restore --version
        uv run pytest -q --require-tools
        uv run python scripts/check_railroad.py
        uv run python scripts/render_railroad.py --check

  web-editor:
    # A required check of its own, listed in .conventions.toml extra_checks.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web-editor/.nvmrc
          cache: npm
          cache-dependency-path: web-editor/package-lock.json
      - run: npm ci
      - run: npm test
      # The bundle is committed and served as it stands, so a source change without a rebuild is a bug.
      - name: Committed bundle matches the sources
        run: npm run build && git diff --exit-code ../src/doomtp_bot/api/static/editor

  image:
    # A pull request builds the image and stops there. Pushes to main and dev and release tags publish
    # one (ADR-0013, ADR-0021).
    needs: ci
    uses: vEXOULZ/conventions/.github/workflows/publish-image.yml@v2.0.0
    permissions:
      contents: read
      packages: write
    with:
      # The compose files parse (services name `.env`, which is gitignored; the example is what a server
      # copies anyway), and a release tag also matches __version__, so /healthz and $bot.version agree.
      pre-build: |
        cp .env.example .env
        docker compose --profile tools config --quiet
        docker compose -f compose.yaml -f compose.dev.yaml --profile tools --profile test config --quiet
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          code=$(grep -m1 '^__version__ = ' src/doomtp_bot/__init__.py | cut -d'"' -f2)
          echo "tag $GITHUB_REF_NAME, __version__ $code"
          [ "$GITHUB_REF_NAME" = "v$code" ]
        fi
